<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hackie</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <div class="mascot" role="img" aria-label="Hackie"></div>

      <section class="panel">
        <div class="stat">
          <span class="stat-label">Watched today:</span>
          <span class="stat-value" id="today">0 min</span>
        </div>

        <div class="stat">
          <span class="stat-label">Breaks Taken:</span>
          <span class="stat-value" id="ex">0</span>
        </div>

        <button class="action" id="test" type="button">Run Hackie</button>
        <button class="action" id="reset" type="button">Reset Mood</button>

        <label class="limit" for="limit">
          Nag me every
          <input type="number" id="limit" min="1" value="20" />
          min
        </label>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
