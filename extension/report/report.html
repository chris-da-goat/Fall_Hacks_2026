<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskWhip report</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="report.css" />
    <script src="../shared/mascot.js"></script>
    <script type="module" src="report.js"></script>
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <div class="hackie" id="hackie"></div>
        <div>
          <h1>Your last two weeks, according to Hackie</h1>
          <p id="verdict" class="verdict"></p>
        </div>
      </header>

      <section class="kpis" id="kpis"></section>

      <section class="card block">
        <div class="block-head">
          <h2>Daily breakdown</h2>
          <div class="legend"><span class="sw work"></span>Work <span class="sw slack"></span>Slacking <span class="sw neutral"></span>Neutral</div>
        </div>
        <div class="chart" id="chart" role="img" aria-label="Stacked bar chart of daily time by category"></div>
      </section>

      <div class="cols">
        <section class="card block">
          <h2>Where the slacking went</h2>
          <ul class="rank" id="slackSites"></ul>
        </section>
        <section class="card block">
          <h2>Where the work happened</h2>
          <ul class="rank" id="workSites"></ul>
        </section>
      </div>

      <section class="card block">
        <h2>Hackie's log</h2>
        <table class="log">
          <thead>
            <tr><th>Day</th><th>Work</th><th>Slacking</th><th>Focus</th><th>Nudges</th><th>Whips</th><th>Lockdowns</th><th>Comebacks</th></tr>
          </thead>
          <tbody id="log"></tbody>
        </table>
      </section>
    </div>
  </body>
</html>
